name: 🚀 Deploy to Hostinger

on:
  push:
    branches:
      - development  # Change to your default branch if needed

obs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🚀 Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./  # Adjust if files are inside a subfolder
        server-dir: /public_html/  # Hostinger's default root directory
